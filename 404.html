<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found — Dikshant Patodia</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f6f4ef" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f4ef;
        color: #17150f;
        font-family: Georgia, 'Times New Roman', serif;
        padding: 2rem;
      }
      main {
        max-width: 34rem;
      }
      .eyebrow {
        font-family: 'Courier New', monospace;
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #2440e0;
      }
      h1 {
        font-size: clamp(2rem, 7vw, 3.25rem);
        line-height: 1.02;
        letter-spacing: -0.02em;
        font-weight: 400;
        margin: 1.25rem 0 0;
      }
      p {
        color: #423e35;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.65;
        margin: 1.25rem 0 0;
      }
      a {
        color: #17150f;
        text-underline-offset: 0.22em;
      }
      a:hover {
        color: #2440e0;
      }
      .links {
        margin-top: 2rem;
        display: flex;
        flex-wrap: wrap;
        gap: 1.25rem;
        font-family: 'Courier New', monospace;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Error 404</p>
      <h1>This route was never wired up.</h1>
      <p>
        The page you were looking for does not exist. Good thing a missing route degrades one path,
        not the whole application.
      </p>
      <nav class="links">
        <a href="/">← Back to the portfolio</a>
        <a href="/blog">Blog</a>
        <a href="/#work">Work</a>
        <a href="/#contact">Contact</a>
      </nav>
    </main>
  </body>
</html>
